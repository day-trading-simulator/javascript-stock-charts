<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StockChart v4.0 - Demo</title>
    <link href="stock-chart.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 24px; background: #0b0d10; color: #c9ced6; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; }
        h1 { margin: 0 0 6px; font-size: 24px; color: #fff; }
        p { margin: 0 0 20px; color: #8a919c; }
        a { color: #3ED69B; text-decoration: none; }
        h2 { margin: 28px 0 10px; font-size: 15px; color: #fff; }
        .chart { max-width: 1100px; height: 520px; border: 1px solid #23272e; border-radius: 8px; overflow: hidden; }
        .chart > .sc-chart-container { height: 100%; }
    </style>
</head>
<body>
    <h1>StockChart v4.0</h1>
    <p>Free JavaScript stock chart by <a href="https://simul8or.com/Javascript-Stock-Chart.php">simul8or</a>. Live crypto from Hyperliquid's public API; sample data if you're offline.</p>

    <h2>BTC &middot; 1 minute &middot; live candles</h2>
    <div id="chart1" class="chart"></div>

    <h2>ETH &middot; 1 hour &middot; line, light theme</h2>
    <div id="chart2" class="chart"></div>

    <script src="indicators.js"></script>
    <script src="patterns.js"></script>
    <script src="emoji-data.js"></script>
    <script src="stock-chart.js"></script>
    <script>
        (function () {
            var API = 'https://api.hyperliquid.xyz';
            var STEP = { '1m': 60000, '1h': 3600000 };
            function toBar(c) { return { t: c.t, open: +c.o, high: +c.h, low: +c.l, close: +c.c, volume: +c.v }; }

            // Random walk, used only when the live API can't be reached.
            function sampleBars(count, stepMs, price) {
                var out = [], now = Math.floor(Date.now() / stepMs) * stepMs;
                for (var i = 0; i < count; i++) {
                    var open = price;
                    price = price * (1 + (Math.random() - 0.5) * 0.004);
                    out.push({ t: now - (count - 1 - i) * stepMs, open: open, close: price,
                        high: Math.max(open, price) * 1.001, low: Math.min(open, price) * 0.999,
                        volume: Math.floor(Math.random() * 400) + 50 });
                }
                return out;
            }

            function liveChart(id, coin, interval, options, fallbackPrice) {
                var end = Date.now();
                fetch(API + '/info', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'candleSnapshot', req: { coin: coin, interval: interval, startTime: end - 300 * STEP[interval], endTime: end } })
                }).then(function (r) { return r.json(); })
                  .then(function (raw) { return raw.map(toBar); })
                  .catch(function () { return null; })
                  .then(function (bars) {
                      var live = !!(bars && bars.length);
                      options.data = live ? bars : sampleBars(300, STEP[interval], fallbackPrice);
                      options.ticker = coin;
                      var chart = new StockChart(id, options);
                      if (!live) return;
                      // Keep the last candle updating.
                      var ws = new WebSocket('wss://api.hyperliquid.xyz/ws');
                      ws.onopen = function () { ws.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'candle', coin: coin, interval: interval } })); };
                      ws.onmessage = function (e) {
                          var msg = JSON.parse(e.data);
                          if (msg.channel !== 'candle') return;
                          var bar = toBar(msg.data), data = chart.stockData, last = data[data.length - 1];
                          if (last && last.t === bar.t) { for (var k in bar) last[k] = bar[k]; }
                          else {
                              data.push(bar);
                              if (chart.isViewPinnedToRightEdge) chart.config.dataOffset = Math.max(0, data.length - chart.config.visibleCandles);
                          }
                          chart.calculateIndicators();
                          chart.drawCharts();
                      };
                  });
            }

            document.addEventListener('DOMContentLoaded', function () {
                liveChart('chart1', 'BTC', '1m', { chartType: 'candlestick', darkMode: true, timeframe: '1min' }, 97000);
                liveChart('chart2', 'ETH', '1h', { chartType: 'line', darkMode: false, timeframe: '1hour' }, 3400);
                // Optional: ticker logos next to the symbol, from any image source you have:
                //   tickerLogoUrl: function (symbol) { return 'https://your-cdn.example/logos/' + symbol + '.png'; }
            });
        })();
    </script>
</body>
</html>
